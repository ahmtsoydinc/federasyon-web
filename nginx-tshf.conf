server {
    listen 80;
    server_name tshf.org.tr www.tshf.org.tr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name tshf.org.tr www.tshf.org.tr;
    ssl_certificate /etc/letsencrypt/live/tshf.org.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tshf.org.tr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Yuklenen dosyalar direkt diskten servis edilir (Next.js'e gerek yok)
    location /uploads/ {
        alias /var/www/tshf/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
    client_max_body_size 50M;
}
